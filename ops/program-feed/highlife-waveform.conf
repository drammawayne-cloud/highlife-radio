# Public amplitude samples from the already-public station programme only.
location = /highlife-waveform.json {
    alias /var/azuracast/stations/rich_row_radio/config/highlife-waveform.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# Stable-origin hop for the existing public programme only. MediaMTX binds HLS
# sessions to its immediate peer; CDN egress addresses can vary between requests.
location ~ ^/highlife-program/(?<program_asset>[a-zA-Z0-9_.-]+\.(?:m3u8|mp4|m4s|ts))$ {
    limit_except GET HEAD { deny all; }
    proxy_pass https://129.213.164.255:8443/highlife-radio/$program_asset$is_args$args;
    proxy_ssl_server_name on;
    proxy_ssl_name richrow-radio.129-213-164-255.sslip.io;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/nginx/azuracast.conf.d/highlife-ca.pem;
    proxy_set_header Host richrow-radio.129-213-164-255.sslip.io;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 15s;
    proxy_redirect /highlife-radio/ /highlife-program/;
    add_header Cache-Control "no-store" always;
}
